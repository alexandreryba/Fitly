[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitly"
version = "1.1.0"
description = "Local job-search assistant: collects public offers, scores them, pre-fills forms. Never submits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "certifi",
    "openpyxl>=3.1",
    "streamlit>=1.35",
]

[project.optional-dependencies]
# Optional features: AI drafts (config/ai.json) and the Playwright pre-fill mode / form audit.
ai = ["anthropic>=0.40"]
browser = ["playwright>=1.45"]
dev = ["fitly[ai,browser]", "pytest>=8", "ruff>=0.6"]

[project.scripts]
fitly = "fitly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["_archive", "backups", ".venv", "data", "config", ".git"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["_archive", "backups", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # long lines are left to the formatter
    "RUF001",  # French text: typographic apostrophes and non-breaking spaces are intended
    "RUF002",
    "RUF003",
    "SIM105",  # try/except/pass reads better than contextlib.suppress in these short guards
]

[tool.ruff.lint.per-file-ignores]
# Tests: imports after pytest.importorskip / environment setup, small lambdas and fakes are fine there.
"tests/**" = ["E402", "E731", "B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["fitly"]
